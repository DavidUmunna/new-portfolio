<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/components/assets/muscle.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/dist/styles.css" rel="stylesheet">

    <title>Portfolio(David Umunna)</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Static shim so Netlify's build-time bot can detect this form and provision
      an endpoint for it. The real, visible form lives in
      src/components/Contact.jsx and submits to it via fetch. See that file
      for details.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
